<h2 mat-dialog-title>{{ data ? 'Edit product' : 'New product' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="grid gap-3 pt-2 sm:grid-cols-2 min-w-[36rem]">
    <mat-form-field appearance="outline">
      <mat-label>SKU</mat-label>
      <input matInput formControlName="sku" maxlength="60" cdkFocusInitial />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Barcode</mat-label>
      <input matInput formControlName="barcode" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="sm:col-span-2">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" maxlength="140" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Category</mat-label>
      <mat-select formControlName="categoryId">
        <mat-option [value]="null">— Uncategorised —</mat-option>
        @for (c of categories.items(); track c.id) {
          <mat-option [value]="c.id">{{ c.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Reorder level</mat-label>
      <input matInput type="number" min="0" step="1" formControlName="reorderLevel" />
      <mat-hint>Shown as low stock when on-hand ≤ this value</mat-hint>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Unit price</mat-label>
      <input matInput type="number" min="0" step="0.01" formControlName="unitPrice" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Cost price</mat-label>
      <input matInput type="number" min="0" step="0.01" formControlName="costPrice" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Tax rate</mat-label>
      <input matInput type="number" min="0" step="0.001" formControlName="taxRate" />
      <mat-hint>Fraction, e.g. 0.17 for 17%</mat-hint>
    </mat-form-field>
    <mat-slide-toggle formControlName="isActive" class="sm:col-span-2">Active</mat-slide-toggle>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="ref.close()">Cancel</button>
  <button mat-flat-button color="primary" [disabled]="form.invalid" (click)="save()">
    {{ data ? 'Save' : 'Create' }}
  </button>
</mat-dialog-actions>
