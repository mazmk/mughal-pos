<h2 mat-dialog-title>{{ data ? 'Edit product' : 'New product' }}</h2>
<mat-dialog-content>
  <form id="product-form" [formGroup]="form" (appSubmit)="save()" class="grid gap-3 pt-2 sm:grid-cols-2">
    <mat-form-field appearance="outline">
      <mat-label>SKU</mat-label>
      <input matInput formControlName="sku" maxlength="60" cdkFocusInitial />
      <mat-error>Enter a SKU</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Barcode</mat-label>
      <input matInput formControlName="barcode" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="sm:col-span-2">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" maxlength="140" />
      <mat-error>Enter a name</mat-error>
    </mat-form-field>
    <app-autocomplete-field
      class="sm:col-span-2"
      formControlName="categoryId"
      label="Category"
      [options]="categoryOptions()"
      clearable
      hint="Leave empty for no category"
      error="Pick a category from the list, or clear the field"
    />
    <mat-form-field appearance="outline">
      <mat-label>Unit price</mat-label>
      <input matInput type="number" min="0" step="0.01" formControlName="unitPrice" />
      <mat-error>Enter 0 or more</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Cost price</mat-label>
      <input matInput type="number" min="0" step="0.01" formControlName="costPrice" />
      <mat-error>Enter 0 or more</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Tax rate</mat-label>
      <input matInput type="number" min="0" step="0.001" formControlName="taxRate" />
      <mat-hint>Fraction, e.g. 0.17 for 17%</mat-hint>
      <mat-error>Enter 0 or more</mat-error>
    </mat-form-field>
    <mat-slide-toggle formControlName="isActive" class="sm:col-span-2">Active</mat-slide-toggle>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="ref.close()">Cancel</button>
  <button mat-flat-button color="primary" type="submit" form="product-form">
    {{ data ? 'Save' : 'Create' }}
  </button>
</mat-dialog-actions>
