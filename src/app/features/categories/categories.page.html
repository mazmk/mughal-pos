<div class="flex flex-col gap-6">
  <header class="flex items-start justify-between gap-4">
    <div>
      <h1 class="m-0 text-2xl font-semibold tracking-tight">Categories</h1>
      <p class="m-0 mt-1 text-sm opacity-70">Organise products into categories.</p>
    </div>
    <button mat-flat-button color="primary" (click)="create()">
      <mat-icon>add</mat-icon>
      New category
    </button>
  </header>

  <mat-card appearance="outlined" class="!rounded-xl">
    <mat-card-content class="!p-0">
      @if (svc.loading()) {
        <div class="flex items-center justify-center p-10">
          <mat-spinner diameter="32" />
        </div>
      } @else if (svc.items().length === 0) {
        <div class="flex flex-col items-center gap-2 p-10 text-center opacity-70">
          <mat-icon class="!h-10 !w-10 !text-4xl">category</mat-icon>
          <p class="m-0">No categories yet. Create your first one to group products.</p>
        </div>
      } @else {
        <table mat-table [dataSource]="svc.items()" class="!w-full">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let row" class="!font-medium">{{ row.name }}</td>
          </ng-container>
          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef>Description</th>
            <td mat-cell *matCellDef="let row" class="opacity-80">{{ row.description || '—' }}</td>
          </ng-container>
          <ng-container matColumnDef="updatedAt">
            <th mat-header-cell *matHeaderCellDef>Updated</th>
            <td mat-cell *matCellDef="let row">{{ row.updatedAt | date: 'short' }}</td>
          </ng-container>
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="!text-right"></th>
            <td mat-cell *matCellDef="let row" class="!text-right">
              <button mat-icon-button (click)="edit(row)" matTooltip="Edit">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button (click)="remove(row)" matTooltip="Delete">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="columns"></tr>
          <tr mat-row *matRowDef="let row; columns: columns"></tr>
        </table>
      }
    </mat-card-content>
  </mat-card>
</div>
