<mat-sidenav-container class="h-screen w-screen">
  <mat-sidenav
    #sidenav
    [mode]="compact() ? 'over' : 'side'"
    [opened]="sidenavOpen()"
    (openedChange)="sidenavOpen.set($event)"
    [disableClose]="!compact()"
    class="!w-60 !border-r"
  >
    <div class="flex h-14 items-center gap-3 px-4 border-b border-outline-variant">
      <mat-icon class="text-primary">storefront</mat-icon>
      <span class="font-semibold tracking-tight">Mughal POS</span>
    </div>

    <mat-nav-list class="!py-2">
      @for (item of navItems; track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="active-link"
          (click)="onNavigate()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="flex flex-col">
    <mat-toolbar class="!h-14 shrink-0 gap-2 border-b border-outline-variant">
      <button mat-icon-button (click)="toggleSidenav()" aria-label="Toggle sidebar">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="font-medium truncate">Mughal Tuck Shop POS</span>
      <span class="flex-1"></span>
      <button
        mat-icon-button
        (click)="cycleTheme()"
        [matTooltip]="'Theme: ' + themeMode()"
      >
        <mat-icon>{{ themeIcon() }}</mat-icon>
      </button>
    </mat-toolbar>

    <main class="flex-1 min-h-0 overflow-auto p-4 lg:p-6">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
