appId: com.mughal.pos
productName: Mughal POS
copyright: Copyright © 2026
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
  - '!**/*.map'
asar: true
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
# Runtime assets read by the main process (window icon), outside the asar:
# <install>/resources/assets/… — see electron/main/main.ts > assetPath().
extraResources:
  - from: assets
    to: assets
mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.business
  minimumSystemVersion: '11.0'
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  shortcutName: Mughal POS
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
linux:
  icon: build/icons
  target:
    - AppImage
  category: Office
deb:
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
